name: Build and Package Xiaomi MiMo Linux

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      upstream_deb_url:
        description: 'Direct download URL for upstream Xiaomi MiMo .deb (optional)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3-pil

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh scripts/*.js

      - name: Download upstream package (if URL specified)
        if: ${{ inputs.upstream_deb_url != '' }}
        run: |
          echo "Downloading upstream package from ${{ inputs.upstream_deb_url }}..."
          curl -fSL -o XiaomiMiMo-upstream.deb "${{ inputs.upstream_deb_url }}"
          ./scripts/build_deb.sh XiaomiMiMo-upstream.deb xiaomi-mimo-desktop-linux-x64.deb

      - name: Validate patch scripts integrity
        run: |
          node -c scripts/patch.js
          bash -n scripts/start.sh
          bash -n scripts/install.sh
          bash -n scripts/build_deb.sh

      - name: Upload Debian Package Artifact (if built)
        if: ${{ inputs.upstream_deb_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-mimo-desktop-linux-deb
          path: "*.deb"
          if-no-files-found: ignore
